name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
    paths:
      - 'deployment/hf-fabric-space/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push deployment to Hugging Face Space
        if: "${{ env.HF_TOKEN != '' }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_NAME || 'MohitSingh-2335/depin-fabric-ledger' }}
        run: |
          git config --global user.email "2335mohitsingh@gmail.com"
          git config --global user.name "Mohit Singh"
          git subtree push --prefix deployment/hf-fabric-space "https://MohitSingh-2335:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main || echo "Notice: Set HF_TOKEN in repo secrets to enable automatic Space sync."
