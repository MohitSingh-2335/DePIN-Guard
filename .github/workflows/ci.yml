name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify Backend Python Syntax
      run: |
        python -m py_compile backend/main.py
        python -m py_compile backend/fabric_manager.py
        python -m py_compile backend/routes/security.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
