# docker-compose.yml — DePIN-Guard Local Lab Stack

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: depin-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - DEPIN_API_KEY=${DEPIN_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - AUTONOMOUS_FEEDER=false
    volumes:
      - ./ai-service:/app/ai-service
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_API_KEY=${DEPIN_API_KEY}
        - VITE_AUTH_URL=${VITE_AUTH_URL:-http://localhost:8000}
    container_name: depin-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  iot:
    build:
      context: .
      dockerfile: iot/Dockerfile
    container_name: depin-iot
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000/api/process_data
      - DEPIN_API_KEY=${DEPIN_API_KEY}
      - CONTINUOUS_LOOP=true
      - STREAM_DELAY=2
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
